name: unpam_mobile
description: "Aplikasi Mobile LMS Kampus (Mentari UNPAM) - Mobile Programming"
publish_to: 'none'
version: 1.0.8+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.1
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.5
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.12.0
  image_picker: ^1.1.2
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - logoaplikasi.jpeg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
