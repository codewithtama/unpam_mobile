name: unpam_mobile
description: "The PAMs - Portal Perkuliahan & Akademik Terpadu"
publish_to: 'none'
version: 1.0.49+49

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.1
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.5
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.12.0
  image_picker: ^1.1.2
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  path: ^1.9.0
  open_filex: ^5.0.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.0
  permission_handler: 11.3.1
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - logoaplikasi.jpeg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
