name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag versi rilis (contoh: v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Unduh Dependensi Flutter
        run: flutter pub get

      - name: Konfigurasi Keystore Penandatanganan Rilis
        env:
          KEYSTORE_BASE64: ${{ secrets['KEYSTORE_BASE64'] }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          else
            echo "" | base64 --decode > android/app/upload-keystore.jks
          fi
          echo "storePassword=unpam123456" > android/key.properties
          echo "keyPassword=unpam123456" >> android/key.properties
          echo "keyAlias=unpam_release_key" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Kompilasi Release APK (Split Per ABI)
        run: |
          mkdir -p build/dist-apks
          # Kompilasi APK Split-per-ABI (~16MB - 20MB per arsitektur CPU)
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols
          cp build/app/outputs/flutter-apk/*.apk build/dist-apks/

      - name: Buat GitHub Release & Unggah APK
        uses: softprops/action-gh-release@v2
        with:
          name: Pembaruan The PAMs ${{ github.ref_name || github.event.inputs.version }}
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: build/dist-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
